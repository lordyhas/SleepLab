name: Release

# Runs only when something lands on `production` (in practice: merging main into it).
# Builds the signed release, then publishes a GitHub Release tagged v<versionName>.
on:
  push:
    branches: [production]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          code=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          if [ -z "$name" ] || [ -z "$code" ]; then
            echo "::error::Could not read versionName / versionCode from app/build.gradle.kts"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"

      # Fail before building anything if this version was already released.
      - name: Check the version is new
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Release ${{ steps.version.outputs.tag }} already exists. Bump versionName and versionCode in app/build.gradle.kts."
            exit 1
          fi

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SLEEPLAB_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SLEEPLAB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SLEEPLAB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SLEEPLAB_KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret SLEEPLAB_$name is not set."
              missing=1
            fi
          done
          exit $missing

      # Matches toolchainVersion in gradle/gradle-daemon-jvm.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SLEEPLAB_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "SLEEPLAB_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed APK and bundle
        env:
          SLEEPLAB_KEYSTORE_PASSWORD: ${{ secrets.SLEEPLAB_KEYSTORE_PASSWORD }}
          SLEEPLAB_KEY_ALIAS: ${{ secrets.SLEEPLAB_KEY_ALIAS }}
          SLEEPLAB_KEY_PASSWORD: ${{ secrets.SLEEPLAB_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Collect artifacts
        id: artifacts
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          aab=app/build/outputs/bundle/release/app-release.aab
          if [ ! -f "$apk" ]; then
            echo "::error::Signed APK not found: the release build was not signed."
            exit 1
          fi
          mkdir dist
          cp "$apk" "dist/SleepLab-${{ steps.version.outputs.name }}.apk"
          cp "$aab" "dist/SleepLab-${{ steps.version.outputs.name }}.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Publish GitHub Release
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/* \
            --target "${{ github.sha }}" \
            --title "SleepLab ${{ steps.version.outputs.name }}" \
            --generate-notes
